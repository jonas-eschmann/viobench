[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viobench"
version = "0.0.1"
description = "Compute-aware relative state estimation challenge: run and score solution .wasm modules, episode datasets, submission server, and the recipes to build a solution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "wasmtime==50.0.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
    "hyperdrone==0.1.10",
]

[project.optional-dependencies]
train = ["torch", "onnx"]
server = ["fastapi", "uvicorn", "python-multipart", "tzdata"]  # tzdata: the quota's Pacific-time days where the OS has no zoneinfo
dev = ["pytest", "torch", "onnx", "fastapi", "python-multipart", "tzdata", "httpx"]  # httpx: the server tests' client

[project.scripts]
viobench = "viobench.tools.cli:main"

# viobench.tools is the host side; viobench.solution is the guest side and consists of files, not modules, except
# workspace.py and the Python runtime's bundler, reached through implicit namespace packages (no __init__.py in solution/).
[tool.setuptools.packages.find]
include = ["viobench", "viobench.tools*", "viobench.solution", "viobench.solution.runtime", "viobench.solution.runtime.python", "viobench.solution.runtime.python.bundler"]
namespaces = true

[tool.setuptools.package-data]
"viobench.tools.datasets.generate" = ["*.h.in"]
"viobench.tools" = ["config.json"]
"viobench.tools.server" = ["ui/*"]
# the build recipe and examples that `viobench init` copies into new workspaces
"viobench.solution" = [
    "toolchain/*", "runtime/native/*", "runtime/python/*", "runtime/python/guest/*", "runtime/python/cpython/*",
    "runtime/python/cpython/patches/*", "runtime/python/cpython/scripts/*", "examples/python/minimal/*", "examples/native/cpp_minimal/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
