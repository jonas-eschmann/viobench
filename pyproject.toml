[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eecs116"
version = "0.1.0"
description = "EECS 116/216 relative pose-estimation challenge: bundle, check and evaluate solution .wasm files; dataset tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "wasmtime==50.0.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
data = ["opencv-python-headless>=4.9", "pyyaml>=6"]
sim = ["opencv-python-headless>=4.9", "pyyaml>=6", "hyperdrone==0.1.8"]
train = ["torch", "onnx"]
server = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "opencv-python-headless>=4.9", "pyyaml>=6", "torch", "onnx"]

[project.scripts]
eecs116 = "eecs116.__main__:main"

[tool.setuptools.packages.find]
include = ["eecs116*"]

[tool.setuptools.package-data]
"eecs116.data" = ["*.h.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]
