# The submission server: the REST API (app) and the evaluation worker, sharing the server-data volume; `episodes`,
# which downloads the worker's evaluation episodes (worker.EPISODES) into the conta-cache volume before the worker starts
# (the worker has no network); and a Cloudflare tunnel in front of the app. From the viobench repository root:
#
#   (umask 077; printf %s "<tunnel token>" > viobench/tools/server/tunnel-token)  # once; see the tunnel below
#   sudo chown 65532 viobench/tools/server/tunnel-token  # cloudflared's uid: outside swarm, secrets keep the host owner
#   docker compose -f viobench/tools/server/compose.yaml up -d --build
#   docker compose -f viobench/tools/server/compose.yaml exec app python -m viobench.tools.server.teams add "team a"
#
# After changing EPISODES, the same `up -d --build` fetches the new episodes and restarts the worker.
# No port is published: the tunnel service connects out to Cloudflare, which terminates TLS. Create a tunnel in the
# Cloudflare dashboard (Zero Trust > Networks > Tunnels), give it a public hostname with service http://app:8000 and put
# its token in the gitignored tunnel-token file (a secret: not in the environment or `docker inspect`; rotate it in the
# dashboard if it leaks). Cloudflare's request body limit (100 MB on Free and Pro) caps the uploads.
name: viobench-server

x-server: &server
  build:
    context: ../../..
    dockerfile: viobench/tools/server/Dockerfile
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  app:
    <<: *server
    command: uvicorn viobench.tools.server.app:app --host 0.0.0.0 --port 8000  # reachable only on the compose network
    volumes: [server-data:/srv/server-data]

  tunnel:
    image: cloudflare/cloudflared:latest  # Cloudflare supports a release for a year: `docker compose pull` now and then
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [tunnel_token]
    depends_on: [app]

  episodes:
    <<: *server
    command: python -m viobench.tools.server.worker --fetch  # through the conta index; cached episodes are not fetched again
    restart: "no"  # one-shot
    volumes: [conta-cache:/srv/conta]

  worker:
    <<: *server
    command: python -m viobench.tools.server.worker  # exactly one: on start it requeues what a previous one left running
    network_mode: none  # wasmtime sandboxes the guest, not the evaluation process
    mem_limit: ${WORKER_MEMORY:-8g}
    depends_on:
      episodes:
        condition: service_completed_successfully
    volumes:
      - server-data:/srv/server-data
      - conta-cache:/srv/conta:ro

volumes:
  server-data:
  conta-cache:

secrets:
  tunnel_token:
    file: tunnel-token
